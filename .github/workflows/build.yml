name: Windows x86

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret exposure check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run checksum-verified secret scanner
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts=--all .
  build:
    name: MSVC x86 ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch and verify original SDK headers
        run: ./scripts/Fetch-WinampSdk.ps1 -SevenZip (Get-Command 7z.exe -ErrorAction Stop).Source
      - name: Configure CMake for Win32
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DBUILD_TESTING=ON
      - name: Build plugin and tests
        run: cmake --build build --config ${{ matrix.configuration }} --parallel
      - name: Run automated tests
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
      - name: Validate package
        if: matrix.configuration == 'Release'
        run: ./tests/packaging_tests.ps1
      - name: Assemble release package
        if: matrix.configuration == 'Release'
        run: ./scripts/Package-Plugin.ps1 -OutputDirectory build/package
      - name: Upload release build package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winamp-plex-library-win32-release
          path: build/package/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-win32-${{ matrix.configuration }}
          path: build/Testing/Temporary/LastTest.log
          retention-days: 14
